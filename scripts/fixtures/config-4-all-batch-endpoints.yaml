server:
  host: "0.0.0.0"
  port: 8000
auth:
  api_keys_file: "api_keys.yaml"
routes:
  /v1/chat/completions:
    mode: batch_proxy
  # dropped because it is legacy and I didn't want to faff about finding the model to use with it
  # /v1/completions:
  #   mode: batch_proxy
  /v1/embeddings:
    mode: batch_proxy
  /v1/moderations:
    mode: batch_proxy
  /v1/responses:
    mode: batch_proxy
redis:
  url: "redis://openai_batch_proxy-redis-1:6379/0"
  namespace: "batch_proxy"
cors:
  allow_origins: ["*"]
