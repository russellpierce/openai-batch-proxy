###############################################################################
#                         SERVER CONFIGURATION                                 #
#                                                                             #
#  This file controls all server behavior. The server will FAIL TO START     #
#  if this file is missing or contains invalid values.                        #
###############################################################################

# Server binding configuration
server:
  host: "0.0.0.0"      # Interface to bind to
  port: 8000           # Port to listen on (1-65535)

# Authentication configuration
auth:
  # Path to YAML file containing API key mappings
  # Server will FAIL TO START if file is missing or empty
  api_keys_file: "api_keys.yaml"

# Route configuration - per-path mode and override settings
# Unmatched paths default to passthrough mode with no overrides
routes:
  /v1/chat/completions:
    mode: batch_proxy
    overrides:
      body:
        service_tier:
          value: "flex"
          mode: "force"
  /v1/responses:
    overrides:
      body:
        service_tier:
          value: "flex"
          mode: "force"
        reasoning.effort:
          value: "low"
          mode: "default"

# Redis configuration (only used when batch_proxy routes exist)
#redis:
#  url: "redis://openai_batch_proxy-redis-1:6379/0"
#  namespace: "batch_proxy"

# CORS (Cross-Origin Resource Sharing) configuration
cors:
  # Allowed origins - use ["*"] to allow all origins
  allow_origins:
    - "*"
