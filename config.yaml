###############################################################################
#                         SERVER CONFIGURATION                                 #
#                                                                             #
#  This file controls all server behavior. The server will FAIL TO START     #
#  if this file is missing or contains invalid values.                        #
###############################################################################

# Server binding configuration
server:
  host: "0.0.0.0"      # Interface to bind to
  port: 8000           # Port to listen on (1-65535)

# Authentication configuration
auth:
  # Path to YAML file containing API key mappings
  # Server will FAIL TO START if file is missing or empty
  api_keys_file: "api_keys.yaml"

# Available models - clients can only request models in this list
# These names are returned by GET /v1/models
# Server will FAIL TO START if list is empty
models:
  - default_workflow

# Workflow mode: "workflow" (default) or "batch_proxy"
# - workflow: synchronous custom AI workflow
# - batch_proxy: proxies requests through OpenAI Batch API
workflow: batch_proxy

# Redis configuration (only used in batch_proxy mode)
redis:
  url: "redis://skeleton_open_ai-redis-1:6379/0"
  namespace: "batch_proxy"

# CORS (Cross-Origin Resource Sharing) configuration
cors:
  # Allowed origins - use ["*"] to allow all origins
  allow_origins:
    - "*"
